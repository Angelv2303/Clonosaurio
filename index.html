<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clonosaurio</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f7f7f7;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    #contenedor {
        text-align: center;
    }

    h1 {
        margin-bottom: 10px;
    }

    #juego {
        position: relative;
        width: 800px;
        height: 300px;
        max-width: 95vw;
        border: 3px solid #333;
        background: white;
        overflow: hidden;
    }

    #suelo {
        position: absolute;
        bottom: 40px;
        left: 0;
        width: 100%;
        height: 3px;
        background: #333;
    }

    #dino {
        position: absolute;
        left: 80px;
        bottom: 43px;
        width: 45px;
        height: 55px;
        background: #333;
        border-radius: 8px 8px 3px 3px;
    }

    /* Ojo */
    #dino::before {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        background: white;
        right: 7px;
        top: 10px;
        border-radius: 50%;
    }

    /* Piernas */
    #dino::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 18px;
        background: #333;
        bottom: -13px;
        left: 7px;
        box-shadow: 20px 0 #333;
    }

    #cactus {
        position: absolute;
        right: -40px;
        bottom: 43px;
        width: 30px;
        height: 55px;
        background: #248b35;
        border-radius: 5px;
    }

    #cactus::before,
    #cactus::after {
        content: "";
        position: absolute;
        background: #248b35;
        width: 14px;
        height: 28px;
        border-radius: 5px;
    }

    #cactus::before {
        left: -10px;
        top: 20px;
    }

    #cactus::after {
        right: -10px;
        top: 10px;
    }

    #puntos {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 20px;
        font-weight: bold;
    }

    #mensaje {
        position: absolute;
        width: 100%;
        top: 105px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
    }

    #instrucciones {
        margin-top: 15px;
        color: #555;
    }

    button {
        margin-top: 10px;
        padding: 10px 25px;
        font-size: 16px;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        #juego {
            height: 250px;
        }
    }
</style>
</head>

<body>

<div id="contenedor">

    <h1>🦖 Clonosaurio</h1>

    <div id="juego">

        <div id="puntos">00000</div>

        <div id="mensaje">
            Presiona ESPACIO para comenzar
        </div>

        <div id="dino"></div>

        <div id="cactus"></div>

        <div id="suelo"></div>

    </div>

    <div id="instrucciones">
        ESPACIO = Saltar
    </div>

    <button onclick="reiniciar()">Reiniciar</button>

</div>

<script>

const dino = document.getElementById("dino");
const cactus = document.getElementById("cactus");
const puntosTexto = document.getElementById("puntos");
const mensaje = document.getElementById("mensaje");

let jugando = false;
let saltando = false;
let gameOver = false;

let dinoY = 0;
let velocidadY = 0;

let cactusX = 800;

let puntos = 0;
let velocidad = 6;

let ultimoTiempo = 0;


/* =========================
   SALTO
========================= */

function saltar() {

    if (!jugando) {
        comenzar();
    }

    if (saltando || gameOver)
        return;

    saltando = true;
    velocidadY = 13;
}


/* =========================
   COMENZAR
========================= */

function comenzar() {

    if (gameOver)
        return;

    jugando = true;
    mensaje.style.display = "none";

    ultimoTiempo = performance.now();

    requestAnimationFrame(bucle);
}


/* =========================
   BUCLE PRINCIPAL
========================= */

function bucle(tiempo) {

    if (!jugando)
        return;

    let dt = (tiempo - ultimoTiempo) / 16.67;
    ultimoTiempo = tiempo;

    if (dt > 2)
        dt = 2;


    /* ----- FÍSICA DEL DINOSAURIO ----- */

    if (saltando) {

        dinoY += velocidadY * dt;

        velocidadY -= 0.7 * dt;

        if (dinoY <= 0) {

            dinoY = 0;
            velocidadY = 0;
            saltando = false;

        }
    }

    dino.style.transform =
        `translateY(${-dinoY}px)`;


    /* ----- CACTUS ----- */

    cactusX -= velocidad * dt;

    if (cactusX < -50) {

        cactusX = 800 + Math.random() * 300;

        puntos++;

        puntosTexto.textContent =
            String(puntos).padStart(5, "0");


        /* Aumentar dificultad */

        if (puntos % 5 === 0) {
            velocidad += 0.7;
        }
    }

    cactus.style.left = cactusX + "px";


    /* ----- COLISIÓN ----- */

    const dinoRect = dino.getBoundingClientRect();
    const cactusRect = cactus.getBoundingClientRect();

    const margen = 8;

    const colision =
        dinoRect.right - margen > cactusRect.left &&
        dinoRect.left + margen < cactusRect.right &&
        dinoRect.bottom - margen > cactusRect.top &&
        dinoRect.top + margen < cactusRect.bottom;


    if (colision) {

        terminar();
        return;
    }


    requestAnimationFrame(bucle);
}


/* =========================
   GAME OVER
========================= */

function terminar() {

    jugando = false;
    gameOver = true;

    mensaje.style.display = "block";

    mensaje.innerHTML =
        "💥 GAME OVER<br>" +
        "<small>Presiona ESPACIO para volver a jugar</small>";
}


/* =========================
   REINICIAR
========================= */

function reiniciar() {

    jugando = false;
    saltando = false;
    gameOver = false;

    dinoY = 0;
    velocidadY = 0;

    cactusX = 800;

    puntos = 0;
    velocidad = 6;

    puntosTexto.textContent = "00000";

    cactus.style.left = cactusX + "px";

    dino.style.transform = "translateY(0)";

    mensaje.style.display = "block";
    mensaje.innerHTML =
        "Presiona ESPACIO para comenzar";
}


/* =========================
   TECLADO
========================= */

document.addEventListener("keydown", function(e) {

    if (e.code === "Space") {

        e.preventDefault();

        if (gameOver) {
            reiniciar();
            saltar();
        }
        else {
            saltar();
        }
    }
});


/* También permitir clic */

document.getElementById("juego")
    .addEventListener("click", saltar);

</script>

</body>
</html>
